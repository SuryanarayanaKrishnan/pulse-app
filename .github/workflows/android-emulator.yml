name: Android emulator smoke (manual)

# Installs the debug APK on an API 30 x86_64 emulator, launches it, and
# captures logcat and a screenshot. Slow (about 15-20 min, Linux 1x minutes),
# so manual only. Guide: docs/SIDELOAD.md

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/ci/emulator_smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: |
            emulator-out/logcat.txt
            emulator-out/launch.png
            emulator-out/summary.txt
          retention-days: 14
