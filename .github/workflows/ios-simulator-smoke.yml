name: iOS simulator smoke

# Boots an iPhone simulator, launches the real app (real database, real
# catalog, no mocks) and fails if it errors on start. macOS minutes are free on
# public repositories; if this repo goes private again, keep this manual
# (workflow_dispatch) because macOS minutes count 10x.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run the launch smoke test
        run: flutter test integration_test/smoke_test.dart -d "${{ steps.sim.outputs.udid }}"
