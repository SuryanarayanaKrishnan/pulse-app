name: CI

# Lean Linux-only checks on every push and pull request: analyze, test, and an
# Android APK as a downloadable artifact. Linux minutes count 1x against the
# GitHub free quota. Minute budget: docs/SIDELOAD.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Includes the device-free smoke test in test/smoke/.
      - name: Test
        run: flutter test

  android-apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get

      # Compiles the Kotlin capture code (SMS receiver, notification listener).
      # The release build is signed with the debug keystore (android/app/build.gradle.kts),
      # so the APK installs directly on a phone with "install unknown apps" allowed.
      - name: Build release APK (debug-keystore signed)
        timeout-minutes: 25
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
